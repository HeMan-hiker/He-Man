<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex,nofollow">
<title>UA 테스트 (임시)</title>
</head>
<body>
<pre id="out">running…</pre>
<script>
(function(){
  var TARGET = 'https://heman-hiker.github.io/He-Man/nell-x/?uatest=' + Date.now();
  var UAS = {
    samsung: 'Mozilla/5.0 (Linux; Android 14; SM-S928N) AppleWebKit/537.36 (KHTML, like Gecko) SamsungBrowser/26.0 Chrome/122.0.0.0 Mobile Safari/537.36',
    chromeAndroid: 'Mozilla/5.0 (Linux; Android 14; Pixel 8) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/122.0.0.0 Mobile Safari/537.36',
    iphone: 'Mozilla/5.0 (iPhone; CPU iPhone OS 17_5 like Mac OS X) AppleWebKit/605.1.15 (KHTML, like Gecko) Version/17.5 Mobile/15E148 Safari/604.1'
  };
  var INTENT_RE = /^intent:\/\/music\.youtube\.com\/(watch\?v=|playlist\?list=)[^#]+#Intent;scheme=https;package=com\.google\.android\.apps\.youtube\.music;S\.browser_fallback_url=[^;]+;end$/;

  function sleep(ms){ return new Promise(function(r){ setTimeout(r, ms); }); }

  function run(ua){
    return fetch(TARGET, {cache:'no-store'}).then(function(r){ return r.text(); }).then(function(html){
      var inj = '<script>Object.defineProperty(navigator,"userAgent",{get:function(){return ' +
        JSON.stringify(ua) + '},configurable:true});<\/script>';
      var doc = html.replace('<meta charset="utf-8">', '<meta charset="utf-8">' + inj);
      var ifr = document.createElement('iframe');
      ifr.style.cssText = 'position:fixed;left:-9999px;top:0;width:420px;height:600px';
      var loaded = new Promise(function(res){ ifr.onload = res; setTimeout(res, 8000); });
      document.body.appendChild(ifr);
      ifr.srcdoc = doc;
      return loaded.then(function(){ return sleep(400); }).then(function(){
        var d = ifr.contentDocument;
        var as = [].slice.call(d.querySelectorAll('a[href*="music.youtube.com"], a[href^="intent://"]'));
        var rows = as.map(function(a){
          return {
            h: a.getAttribute('href'),
            t: a.getAttribute('target'),
            w: a.getAttribute('data-web')
          };
        });
        var uaSeen = ifr.contentWindow.navigator.userAgent;
        ifr.parentNode.removeChild(ifr);
        var intent = rows.filter(function(r){ return r.h && r.h.indexOf('intent://') === 0; });
        var https = rows.filter(function(r){ return r.h && r.h.indexOf('https://music.youtube.com/') === 0; });
        var badFallback = [];
        intent.forEach(function(r, i){
          var m = r.h.match(/S\.browser_fallback_url=([^;]+);end$/);
          var dec = m ? decodeURIComponent(m[1]) : null;
          if (dec !== r.w) badFallback.push(i + ':' + dec + ' != ' + r.w);
        });
        return {
          uaApplied: uaSeen === ua,
          total: rows.length,
          intentCount: intent.length,
          httpsCount: https.length,
          targets: rows.map(function(r){ return String(r.t); }).filter(function(v,i,a){ return a.indexOf(v)===i; }),
          allIntentSyntaxOk: intent.length === rows.length && intent.every(function(r){ return INTENT_RE.test(r.h); }),
          allDataWebKept: rows.every(function(r){ return r.w && r.w.indexOf('https://music.youtube.com/') === 0; }),
          fallbackRoundTrips: badFallback.length === 0,
          badFallback: badFallback,
          sample: (intent[0] || rows[0] || {}).h,
          hdrs: rows.map(function(r){ return (r.h || '').slice(0, 24); })
        };
      });
    });
  }

  var out = {};
  var keys = Object.keys(UAS);
  var p = Promise.resolve();
  keys.forEach(function(k){
    p = p.then(function(){ return run(UAS[k]).then(function(res){ out[k] = res; }); });
  });
  p.then(function(){
    window.__result = out;
    document.getElementById('out').textContent = JSON.stringify(out, null, 1);
  }).catch(function(e){
    window.__result = {error: String(e)};
    document.getElementById('out').textContent = 'ERROR: ' + e;
  });
})();
</script>
</body>
</html>
